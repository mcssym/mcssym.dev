name: mcssym_dev
description: "Maxime Fankam's editorial CV and open-source portfolio, built with Flutter and Flueco."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flueco: ^0.0.1-alpha.5
  flueco_state_management: ^0.0.1-alpha.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
